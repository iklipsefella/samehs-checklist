<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Sameh's Checklist</title>
</head>
<body>
  <main>
    <div class="brand"><img src="icons/icon-48.png" alt=""><div><strong>Sameh's Checklist</strong><small>Capture selected text</small></div></div>
    <button id="capture">Add current selection <kbd>Alt Shift T</kbd></button>
    <button id="open" class="secondary">Open checklist</button>
    <p>Highlight a WhatsApp, Slack, email, or browser message first. The checklist opens with the text ready to review.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
